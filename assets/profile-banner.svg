<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Shayan — backend, web, and a little tinkering</title>
  <desc id="description">A dark terminal-inspired banner introducing Shayan, also known as xshayank, an aspiring software engineer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#1d1934"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6c4e0" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="64" y="75" font-size="18" fill="#83e6c5">~/xshayank</text>
    <text x="64" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="66" font-weight="700" letter-spacing="-2" fill="#f0f3fa">Hey, I'm Shayan.</text>
    <text x="66" y="208" font-size="21" fill="#c2c9dc">Aspiring software engineer.</text>
    <text x="66" y="287" font-size="19" fill="#83e6c5">backend <tspan fill="#727e98">/</tspan> web <tspan fill="#727e98">/</tspan> tinkering</text>
    <rect x="800" y="65" width="330" height="230" rx="14" fill="#111827" stroke="#394258"/>
    <path d="M800 108H1130" stroke="#394258"/>
    <circle cx="824" cy="87" r="5" fill="#f091a0"/>
    <circle cx="844" cy="87" r="5" fill="#eac38a"/>
    <circle cx="864" cy="87" r="5" fill="#83e6c5"/>
    <g font-size="18">
      <text x="826" y="151" fill="#83e6c5">$ whoami</text>
      <text x="826" y="184" fill="#f0f3fa">shayan / @xshayank</text>
      <text x="826" y="227" fill="#83e6c5">$ status</text>
      <text x="826" y="260" fill="#c2c9dc">learning. building.</text>
    </g>
  </g>
</svg>
